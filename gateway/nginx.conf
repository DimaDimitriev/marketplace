events {
    worker_connections 1024;
}

http {
    upstream catalog_servers {
        server catalog-1:8002;
        server catalog-2:8002;
    }

    server {
        listen 80;

        # GraphQL IDE / API
        location /graphql {
            proxy_pass http://graphql-gateway:8000/graphql;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth
        location /auth/ {
            proxy_pass http://auth-service:8001/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Catalog (балансировка)
        location /catalog/ {
            proxy_pass http://catalog_servers/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Orders
        location /orders/ {
            proxy_pass http://order-service:8003/orders/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Notifications
        location /notifications/ {
            proxy_pass http://notification-service:8005/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Payments
        location /payments/ {
            proxy_pass http://payment-service:8004/payments/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}